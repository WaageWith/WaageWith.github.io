name: Withings verbinden

# Einmalig (oder nach einem Fehler) manuell starten. Danach wartet der Ablauf bis zu 15 Minuten,
# bis die Freigabe bei Withings erteilt wurde, und speichert den Zugang verschlüsselt.
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: withings-abruf
  cancel-in-progress: false

jobs:
  verbinden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.fetch.outputs.changed }}
    env:
      WITHINGS_CLIENT_ID: ${{ secrets.WITHINGS_CLIENT_ID }}
      WITHINGS_CLIENT_SECRET: ${{ secrets.WITHINGS_CLIENT_SECRET }}
      STATE_KEY: ${{ secrets.STATE_KEY }}
      DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
      RELAY_TOPIC: waagewith-qy5jjsnr4wi487t4qsp2rvif
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet --disable-pip-version-check cryptography==44.0.0
      - name: Auf Freigabe warten
        run: python scripts/withings.py connect
      - name: Erste Messungen abrufen
        id: fetch
        run: python scripts/withings.py fetch
      - name: Speichern
        if: always()
        run: |
          git config user.name "waage-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state site/data.enc.json
          if git diff --cached --quiet; then echo "Nichts Neues."; exit 0; fi
          git commit -q -m "Withings verbunden"
          for i in 1 2 3 4 5; do
            git push -q && exit 0
            sleep $((i * 4)); git pull -q --rebase
          done
          exit 1

  veroeffentlichen:
    needs: verbinden
    if: needs.verbinden.outputs.changed == 'true'
    uses: ./.github/workflows/seite.yml
